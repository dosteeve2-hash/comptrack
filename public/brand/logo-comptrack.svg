<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="CompTrack">
  <defs>
    <linearGradient id="ctGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c25a"/>
      <stop offset="1" stop-color="#c99a1e"/>
    </linearGradient>
    <linearGradient id="ctNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- Icône : livre de comptes + courbe de croissance en coche -->
  <g>
    <rect x="18" y="18" width="124" height="124" rx="28" fill="url(#ctNavy)"/>
    <rect x="18" y="18" width="124" height="124" rx="28" fill="none" stroke="url(#ctGold)" stroke-width="2" opacity=".55"/>
    <!-- Lignes de registre -->
    <g stroke="#3b4d75" stroke-width="4" stroke-linecap="round" opacity=".8">
      <line x1="44" y1="52" x2="86" y2="52"/>
      <line x1="44" y1="72" x2="74" y2="72"/>
      <line x1="44" y1="92" x2="66" y2="92"/>
    </g>
    <!-- Coche-croissance : la vérification ET la progression -->
    <path d="M44 106 L72 118 L118 56"
          fill="none" stroke="url(#ctGold)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="56" r="7.5" fill="#e9c25a"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Outfit, 'Segoe UI', sans-serif">
    <text x="168" y="92" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#0e1c33">Comp<tspan fill="#c99a1e">Track</tspan></text>
    <text x="171" y="122" font-size="15" font-weight="600" letter-spacing="5.5" fill="#5b6c8f">COMPTABILITÉ · OHADA</text>
  </g>
</svg>
